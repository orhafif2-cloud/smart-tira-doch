<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f4e79">
<title>סמרט טירה — דוח גבייה</title>
<style>
:root{
  --bg:#f4f6fa;--panel:#fff;--ink:#16202e;--muted:#6b7a90;--line:#e3e8f0;
  --brand:#1f4e79;--brand2:#2f7fbf;--ok:#12805c;--warn:#a86200;--bad:#b4262b;
  --chip:#eef3f9;--shadow:0 1px 2px rgba(16,32,64,.06),0 6px 18px rgba(16,32,64,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;-webkit-text-size-adjust:100%}
h1,h2{margin:0;font-weight:650}
h2{font-size:15px;color:var(--brand);margin-bottom:12px}

.topbar{background:var(--brand);color:#fff;padding:12px 14px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:#fff2;display:grid;
  place-items:center;font-weight:800;font-size:13px;flex:none}
.topbar h1{font-size:16px}
.sub{margin:2px 0 0;font-size:11.5px;opacity:.85}
.snapnote{background:#ffffff1f;border-radius:8px;padding:7px 11px;margin-top:10px;
  font-size:11.5px;line-height:1.45}

.tabs{display:flex;background:var(--brand);overflow-x:auto;padding:0 6px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#ffffffb5;font:inherit;font-weight:600;
  font-size:14px;padding:11px 13px;white-space:nowrap;cursor:pointer;
  border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom-color:#fff}

main{padding:12px;max-width:1200px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.panel{background:var(--panel);border-radius:11px;padding:14px;
  box-shadow:var(--shadow);margin-bottom:12px;min-width:0}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--panel);border-radius:11px;padding:13px;box-shadow:var(--shadow);
  border-inline-start:4px solid var(--brand2)}
.card .k{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.card .v{font-size:20px;font-weight:700;letter-spacing:-.3px}
.card .n{font-size:11.5px;color:var(--muted);margin-top:4px}
.card.bad{border-inline-start-color:var(--bad)}
.card.ok{border-inline-start-color:var(--ok)}
.card.warn{border-inline-start-color:var(--warn)}
.card.click{cursor:pointer}
#kpis .card:first-child{grid-column:1/-1}
#kpis .card:first-child .v{font-size:26px}
@media(min-width:760px){
  .cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  #kpis .card:first-child{grid-column:auto}
  main{padding:18px}
}

.tablewrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.desc{max-width:180px;min-width:140px}
td.desc>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.35}
.rowclick{cursor:pointer}
tbody tr:active{background:#eef4fa}

.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.unpaid{background:#fdecec;color:var(--bad)}
.tag.paid{background:#e6f6ef;color:var(--ok)}
.tag.cancel{background:#f0eef8;color:#5b4b9a}
.tag.flag{background:#fff4e0;color:var(--warn);margin-inline-start:4px}

.bigsearch{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--line);
  border-radius:10px;font-family:inherit}
.bigsearch:focus{outline:0;border-color:var(--brand2)}
.invsearch{font-variant-numeric:tabular-nums;letter-spacing:3px;font-weight:600;
  text-align:center}
.filters{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.filters select{flex:1;min-width:0;font:inherit;font-size:13px;padding:8px;
  border:1px solid var(--line);border-radius:8px;background:#fff}
.resultinfo{font-size:12.5px;color:var(--muted);width:100%}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--brand);
  border-radius:99px;padding:3px 11px;font:inherit;font-size:12px;font-weight:600;
  cursor:pointer;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:0}

.bar{margin-bottom:9px}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar .lab b{font-variant-numeric:tabular-nums}
.bar .track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--brand2)}
.bar.b0 .fill{background:#3aa76d}.bar.b1 .fill{background:#7bab3a}
.bar.b2 .fill{background:#d99a2b}.bar.b3 .fill{background:#c0473f}

.invcard .invhead{cursor:pointer;user-select:none;display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:11px;
  border-bottom:1px solid var(--line)}
.invcard.open .invhead{margin-bottom:12px}
.invnum{font-size:15px;font-weight:700;color:var(--brand)}
.invmeta{font-size:12px;color:var(--muted);margin-top:3px}
.invtotals{display:flex;gap:14px;flex-wrap:wrap;width:100%}
.invtotals span{display:block;font-size:11px;color:var(--muted)}
.invtotals b{font-size:15px;font-variant-numeric:tabular-nums}
.invtotals .bad b{color:var(--bad)}
.invtotals .ok b{color:var(--ok)}
.caret{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px}
.invcard.open .caret{transform:rotate(180deg)}
.invlines:empty{display:none}
@media(min-width:760px){.invtotals{width:auto}}

.modal{position:fixed;inset:0;background:#0b1626a8;display:grid;place-items:end stretch;
  z-index:60}
.modalbox{background:#fff;border-radius:14px 14px 0 0;padding:18px 16px;
  max-height:92vh;overflow:auto;position:relative}
.modalclose{position:absolute;inset-inline-start:12px;top:8px;border:0;
  background:transparent;font-size:30px;line-height:1;color:var(--muted);cursor:pointer}
.kv{display:grid;gap:1px 0;font-size:13.5px;margin-bottom:14px}
.kv .k{color:var(--muted);font-size:11.5px;margin-top:9px}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media(min-width:760px){
  .modal{place-items:center}
  .modalbox{border-radius:14px;max-width:860px;width:100%;margin:20px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brandrow">
    <span class="logo">ST</span>
    <div>
      <h1>סמרט טירה</h1>
      <p class="sub" id="fileline"></p>
    </div>
  </div>
  <div class="snapnote" id="snapnote"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="dash">דשבורד</button>
  <button class="tab" data-view="veh">חיפוש רכב</button>
  <button class="tab" data-view="inv">חיפוש חשבונית</button>
  <button class="tab" data-view="qa">בדיקות איכות</button>
</nav>

<main>
  <section id="view-dash" class="view active">
    <div class="cards" id="kpis"></div>
    <div class="panel"><h2>לפי לקוח</h2>
      <div class="tablewrap"><table id="tblClients"></table></div></div>
    <div class="panel"><h2>גיל החוב הפתוח</h2><div id="aging"></div></div>
    <div class="panel"><h2>מחזור חודשי</h2><div id="months"></div></div>
  </section>

  <section id="view-veh" class="view">
    <div class="panel">
      <input id="q" class="bigsearch" type="search" inputmode="numeric"
             autocomplete="off" placeholder="מספר רכב או מספר הזמנה…">
      <div class="filters">
        <select id="fClient"><option value="">כל הלקוחות</option></select>
        <select id="fStatus"><option value="">כל הסטטוסים</option>
          <option value="open">לא שולם</option><option value="paid">שולם</option></select>
      </div>
      <div class="filters"><span class="resultinfo" id="vehinfo"></span></div>
    </div>
    <div class="panel"><div class="tablewrap"><table id="tblRows"></table></div>
      <div style="text-align:center;margin-top:10px">
        <button class="chip" id="more" hidden>הצג עוד</button></div></div>
  </section>

  <section id="view-inv" class="view">
    <div class="panel">
      <input id="qInv" class="bigsearch invsearch" type="search" inputmode="numeric"
             autocomplete="off" maxlength="12" placeholder="3 ספרות אחרונות">
      <div class="filters"><span class="hint">לדוגמה:
        <button class="chip" data-inv="191">191</button>
        <button class="chip" data-inv="204">204</button>
        <button class="chip" data-inv="062">062</button>
        · ריק = הכל</span></div>
      <div class="filters"><span class="resultinfo" id="invinfo"></span></div>
    </div>
    <div id="invResults"></div>
  </section>

  <section id="view-qa" class="view">
    <div class="panel"><h2>בדיקות איכות</h2>
      <p class="hint" style="margin-bottom:12px">שורות שלא נספרות בכסף, כדי
        שהסכומים יהיו נכונים. לחיצה מציגה אותן.</p>
      <div class="cards" id="qaCards"></div></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modalbox"><button class="modalclose" id="mClose">×</button>
    <div id="mBody"></div></div>
</div>

<script id="payload" type="application/json"></script>
<script>
'use strict';
window.__boot = function () {
const D = JSON.parse(document.getElementById('payload').textContent);
const F = D.fields;
const ROWS = D.rows.map(a => Object.fromEntries(F.map((f, i) => [f, a[i]])));

const $ = s => document.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const nis = n => '₪' + Math.round(Number(n) || 0).toLocaleString('he-IL');
const nisF = n => '₪' + (Number(n) || 0).toLocaleString('he-IL',
  {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const heDate = s => s ? s.split('-').reverse().join('/') : '';
const FLAG_HE = {no_price:'בלי מחיר',cancelled:'ביטול',duplicate:'כפילות',
  no_status:'בלי סטטוס',date_as_text:'תאריך כטקסט',bad_plate:'מספר רכב חריג'};

/* --- כותרת --- */
$('#fileline').textContent = D.file.name;
$('#snapnote').innerHTML =
  `<b>תמונת מצב</b> מ-${new Date(D.generated).toLocaleString('he-IL')} · ` +
  `הקובץ עודכן ${new Date(D.file.modified).toLocaleString('he-IL')}<br>` +
  `לצפייה בלבד — לעדכון נתונים השתמש באפליקציה במחשב.`;

/* --- ניווט --- */
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.toggle('active', x === t));
  $$('.view').forEach(v => v.classList.toggle('active',
    v.id === 'view-' + t.dataset.view));
  if (t.dataset.view === 'inv' && !$('#invResults').innerHTML) drawInv();
  window.scrollTo({top: 0});
}));

/* --- דשבורד --- */
const T = D.stats.totals;
$('#kpis').innerHTML = `
  <div class="card bad click" data-f="open"><div class="k">פתוח לגבייה</div>
    <div class="v">${nis(T.open)}</div>
    <div class="n">${nis(T.open_net)} לפני מע״מ</div></div>
  <div class="card ok click" data-f="paid"><div class="k">שולם</div>
    <div class="v">${nis(T.paid)}</div>
    <div class="n">מתוך ${nis(T.total)}</div></div>
  <div class="card"><div class="k">החודש (${T.month})</div>
    <div class="v">${nis(T.month_total)}</div>
    <div class="n">${T.month_rows} עבודות</div></div>
  <div class="card"><div class="k">עבודות</div>
    <div class="v">${T.rows_counted.toLocaleString('he-IL')}</div>
    <div class="n">נספרות בכסף</div></div>
  <div class="card warn click" data-f="qa"><div class="k">הוצא מהחישוב</div>
    <div class="v">${nis(D.stats.quality.excluded_amount)}</div>
    <div class="n">ראה בדיקות איכות</div></div>`;
$$('#kpis .card.click').forEach(c => c.addEventListener('click', () => {
  if (c.dataset.f === 'qa') return $('.tab[data-view="qa"]').click();
  $('.tab[data-view="veh"]').click();
  $('#fStatus').value = c.dataset.f; $('#q').value = ''; drawRows(true);
}));

$('#tblClients').innerHTML = `<thead><tr><th>לקוח</th><th>עבודות</th>
  <th>רכבים</th><th>פתוח</th><th>שולם</th></tr></thead><tbody>` +
  D.stats.by_client.map(c => `<tr class="rowclick" data-c="${esc(c.client)}">
    <td>${esc(c.client)}</td><td class="num">${c.rows}</td>
    <td class="num">${c.vehicles}</td>
    <td class="num" style="color:var(--bad)">${nis(c.open)}</td>
    <td class="num" style="color:var(--ok)">${nis(c.paid)}</td></tr>`).join('') +
  '</tbody>';
$$('#tblClients tbody tr').forEach(tr => tr.addEventListener('click', () => {
  $('.tab[data-view="veh"]').click();
  $('#fClient').value = tr.dataset.c; $('#q').value = ''; drawRows(true);
}));

const ag = D.stats.aging, agMax = Math.max(...Object.values(ag), 1);
$('#aging').innerHTML = Object.entries(ag).filter(([, v]) => v > 0)
  .map(([k, v], i) => `<div class="bar b${i}"><div class="lab">
    <span>${esc(k)} ימים</span><b>${nis(v)}</b></div>
    <div class="track"><div class="fill" style="width:${v / agMax * 100}%"></div>
    </div></div>`).join('') || '<div class="empty">אין חוב פתוח</div>';

const ms = D.stats.by_month.slice(-8), mMax = Math.max(...ms.map(x => x.total), 1);
$('#months').innerHTML = ms.map(x => `<div class="bar"><div class="lab">
  <span>${x.month} · ${x.rows} עבודות</span><b>${nis(x.total)}</b></div>
  <div class="track"><div class="fill" style="width:${x.total / mMax * 100}%"></div>
  </div></div>`).join('');

D.clients.forEach(c => $('#fClient').insertAdjacentHTML('beforeend',
  `<option value="${esc(c)}">${esc(c)}</option>`));

/* --- חיפוש רכב --- */
const PAGE = 150;
let shown = PAGE;

function tags(r) {
  let t = '';
  if (r.status === 'שולם') t += '<span class="tag paid">שולם</span>';
  else if (r.status === 'בוטל') t += '<span class="tag cancel">בוטל</span>';
  else if (r.status) t += `<span class="tag unpaid">${esc(r.status)}</span>`;
  (r.flags || []).forEach(f => { if (FLAG_HE[f])
    t += `<span class="tag flag">${FLAG_HE[f]}</span>`; });
  return t;
}

function filtered() {
  const terms = $('#q').value.trim().split(/\s+/).filter(Boolean);
  const cl = $('#fClient').value, st = $('#fStatus').value;
  return ROWS.filter(r => {
    if (cl && r.client !== cl) return false;
    if (st === 'open' && r.status === 'שולם') return false;
    if (st === 'paid' && r.status !== 'שולם') return false;
    if (!terms.length) return true;
    const hay = [r.plate, r.order, r.invoice, r.desc, r.notes, r.status,
      r.date, r.client].join(' ');
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.row - a.row);
}

function drawRows(reset) {
  if (reset) shown = PAGE;
  const all = filtered(), page = all.slice(0, shown);
  const money = all.filter(r => r.countable);
  $('#vehinfo').innerHTML = `<b>${all.length.toLocaleString('he-IL')}</b> שורות · ` +
    `סה״כ ${nis(money.reduce((s, r) => s + (r.gross || 0), 0))} · ` +
    `פתוח <b style="color:var(--bad)">${nis(money.filter(r => r.status !== 'שולם')
      .reduce((s, r) => s + (r.gross || 0), 0))}</b>`;
  $('#tblRows').innerHTML = `<thead><tr><th>תאריך</th><th>רכב</th><th>הזמנה</th>
    <th>תיאור</th><th>כולל מע״מ</th><th>סטטוס</th></tr></thead><tbody>` +
    (page.map((r, i) => `<tr class="rowclick" data-i="${ROWS.indexOf(r)}">
      <td class="num">${heDate(r.date)}</td><td class="num">${esc(r.plate)}</td>
      <td class="num">${esc(r.order)}</td>
      <td class="desc"><span>${esc(r.desc) || '—'}</span></td>
      <td class="num"><b>${r.gross == null ? '—' : nis(r.gross)}</b></td>
      <td>${tags(r)}</td></tr>`).join('')
     || '<tr><td colspan="6" class="empty">לא נמצאו תוצאות</td></tr>') + '</tbody>';
  $('#more').hidden = shown >= all.length;
  bind('#tblRows');
}
function bind(sel) {
  $$(sel + ' tbody tr[data-i]').forEach(tr =>
    tr.addEventListener('click', () => openRow(ROWS[+tr.dataset.i])));
}
let tmr;
$('#q').addEventListener('input', () => {
  clearTimeout(tmr); tmr = setTimeout(() => drawRows(true), 150);
});
$('#fClient').addEventListener('change', () => drawRows(true));
$('#fStatus').addEventListener('change', () => drawRows(true));
$('#more').addEventListener('click', () => { shown += PAGE; drawRows(false); });
drawRows(true);

/* --- חיפוש חשבונית --- */
function invLines(g) {
  const lines = ROWS.filter(r => (r.invoice || '').replace(/\D/g, '') === g.digits)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.row - b.row);
  return `<div class="tablewrap"><table><thead><tr><th>תאריך</th><th>רכב</th>
    <th>הזמנה</th><th>תיאור</th><th>כולל מע״מ</th><th>סטטוס</th></tr></thead>
    <tbody>${lines.map(r => `<tr class="rowclick" data-i="${ROWS.indexOf(r)}">
      <td class="num">${heDate(r.date)}</td><td class="num">${esc(r.plate)}</td>
      <td class="num">${esc(r.order)}</td>
      <td class="desc"><span>${esc(r.desc) || '—'}</span></td>
      <td class="num"><b>${r.gross == null ? '—' : nis(r.gross)}</b></td>
      <td>${tags(r)}</td></tr>`).join('')}</tbody></table></div>`;
}

function drawInv() {
  const d = $('#qInv').value.replace(/\D/g, '');
  let hits = d ? D.invoices.filter(g => g.digits.endsWith(d)) : D.invoices.slice();
  if (d && !hits.length) hits = D.invoices.filter(g => g.digits.includes(d));
  const auto = hits.length === 1;
  $('#invinfo').innerHTML = hits.length
    ? `<b>${hits.length}</b> חשבוניות · סה״כ ${nis(hits.reduce((s, g) => s + g.gross, 0))}
       · פתוח <b style="color:var(--bad)">${nis(hits.reduce((s, g) => s + g.open, 0))}</b>`
    : '';
  const cls = {'שולם':'paid','לא שולם':'unpaid','שולם חלקית':'cancel'};
  $('#invResults').innerHTML = hits.length ? hits.map(g => `
    <div class="panel invcard${auto ? ' open' : ''}" data-d="${g.digits}">
      <div class="invhead">
        <div><div class="invnum"><span class="caret">▾</span> ${esc(g.invoice)}
          <span class="tag ${cls[g.status] || ''}">${esc(g.status)}</span></div>
          <div class="invmeta">${esc(g.clients.join(', '))} · ${g.count} שורות ·
            ${g.vehicles} רכבים · ${g.first_date === g.last_date ? heDate(g.first_date)
              : heDate(g.first_date) + ' – ' + heDate(g.last_date)}</div></div>
        <div class="invtotals">
          <div><span>כולל מע״מ</span><b>${nis(g.gross)}</b></div>
          <div><span>לפני מע״מ</span><b>${nis(g.net)}</b></div>
          ${g.open ? `<div class="bad"><span>פתוח</span><b>${nis(g.open)}</b></div>` : ''}
          ${g.paid ? `<div class="ok"><span>שולם</span><b>${nis(g.paid)}</b></div>` : ''}
        </div></div>
      <div class="invlines">${auto ? invLines(g) : ''}</div></div>`).join('')
    : `<div class="panel"><div class="empty">לא נמצאה חשבונית שמסתיימת ב-${esc(d)}</div></div>`;

  $$('#invResults .invcard').forEach(card => {
    if (card.classList.contains('open')) bind('#invResults');
    card.querySelector('.invhead').addEventListener('click', () => {
      const box = card.querySelector('.invlines');
      if (card.classList.toggle('open') && !box.innerHTML) {
        box.innerHTML = invLines(D.invoices.find(g => g.digits === card.dataset.d));
        bind('#invResults');
      }
    });
  });
  window.scrollTo({top: 0});
}
let itmr;
$('#qInv').addEventListener('input', () => {
  clearTimeout(itmr); itmr = setTimeout(drawInv, 150);
});
$$('.chip[data-inv]').forEach(b => b.addEventListener('click', () => {
  $('#qInv').value = b.dataset.inv; drawInv();
}));

/* --- בדיקות איכות --- */
const fl = D.stats.quality.flags;
$('#qaCards').innerHTML = ['cancelled','no_price','duplicate','no_status',
  'date_as_text','bad_plate'].filter(k => fl[k]).map(k =>
  `<div class="card warn click" data-flag="${k}">
     <div class="k">${FLAG_HE[k]}</div>
     <div class="v">${fl[k].toLocaleString('he-IL')}</div>
     <div class="n">שורות</div></div>`).join('');
$$('#qaCards .card').forEach(c => c.addEventListener('click', () => {
  $('.tab[data-view="veh"]').click();
  $('#q').value = ''; $('#fClient').value = ''; $('#fStatus').value = '';
  const k = c.dataset.flag;
  const all = ROWS.filter(r => (r.flags || []).includes(k));
  shown = PAGE;
  $('#vehinfo').innerHTML = `<b>${all.length}</b> שורות מסומנות "${FLAG_HE[k]}"`;
  $('#tblRows').innerHTML = `<thead><tr><th>תאריך</th><th>רכב</th><th>הזמנה</th>
    <th>תיאור</th><th>כולל מע״מ</th><th>לקוח</th></tr></thead><tbody>` +
    all.slice(0, 400).map(r => `<tr class="rowclick" data-i="${ROWS.indexOf(r)}">
      <td class="num">${heDate(r.date)}</td><td class="num">${esc(r.plate)}</td>
      <td class="num">${esc(r.order)}</td>
      <td class="desc"><span>${esc(r.desc) || '—'}</span></td>
      <td class="num">${r.gross == null ? '—' : nis(r.gross)}</td>
      <td>${esc(r.client)}</td></tr>`).join('') + '</tbody>';
  $('#more').hidden = true;
  bind('#tblRows');
}));

/* --- פירוט שורה --- */
function openRow(r) {
  const hist = r.plate ? ROWS.filter(x => x.plate === r.plate)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '')) : [];
  const c = hist.filter(x => x.countable);
  $('#mBody').innerHTML = `
    <h2>${r.plate ? 'רכב ' + esc(r.plate) : 'שורה ' + r.row}</h2>
    <div class="kv">
      <span class="k">לקוח</span><span>${esc(r.client)} · שורה ${r.row}</span>
      <span class="k">תאריך</span><span>${heDate(r.date)}</span>
      <span class="k">הזמנה</span><span>${esc(r.order) || '—'}</span>
      <span class="k">תיאור</span><span>${esc(r.desc) || '—'}</span>
      <span class="k">סכום</span><span>${nisF(r.net)} לפני מע״מ ·
        <b>${nisF(r.gross)}</b> כולל</span>
      <span class="k">סטטוס</span><span>${tags(r)}</span>
      <span class="k">חשבונית</span><span>${esc(r.invoice) || '—'}</span>
      <span class="k">הערות</span><span>${esc(r.notes) || '—'}</span>
    </div>
    ${hist.length > 1 ? `<h2>היסטוריית הרכב — ${c.length} עבודות ·
      ${nis(c.reduce((s, x) => s + (x.gross || 0), 0))} · פתוח
      <span style="color:var(--bad)">${nis(c.filter(x => x.status !== 'שולם')
        .reduce((s, x) => s + (x.gross || 0), 0))}</span></h2>
      <div class="tablewrap"><table><thead><tr><th>תאריך</th><th>הזמנה</th>
        <th>תיאור</th><th>כולל</th><th>סטטוס</th></tr></thead><tbody>
        ${hist.map(x => `<tr><td class="num">${heDate(x.date)}</td>
          <td class="num">${esc(x.order)}</td>
          <td class="desc"><span>${esc(x.desc)}</span></td>
          <td class="num">${x.gross == null ? '—' : nis(x.gross)}</td>
          <td>${tags(x)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  $('#modal').hidden = false;
}
$('#mClose').addEventListener('click', () => { $('#modal').hidden = true; });
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') $('#modal').hidden = true;
});
};
</script>

  const KEY = 'st_report_pw';
  const DAYS = 30;
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);

  async function unlock(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b(ENC.salt), iterations: ENC.iter, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(ENC.iv)},
      key, b(ENC.ct));
    return new TextDecoder().decode(out);
  }

  function remembered() {
    try {
      const v = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (v && v.exp > Date.now()) return v.p;
      if (v) localStorage.removeItem(KEY);       // פג תוקף
    } catch (_) {}
    return null;
  }

  function forget() {
    try { localStorage.removeItem(KEY); } catch (_) {}
  }

  function reveal(json, wasRemembered) {
    $('payload').textContent = json;
    $('lock').remove();
    document.body.classList.remove('locked');
    window.__boot();
    if (wasRemembered) addLogout();
  }

  // כפתור התנתקות - מופיע רק כשהסיסמה שמורה במכשיר
  function addLogout() {
    if ($('stLogout')) return;
    const bar = document.querySelector('.topbar');
    if (!bar) return;
    const btn = document.createElement('button');
    btn.id = 'stLogout';
    btn.textContent = 'התנתק ממכשיר זה';
    btn.addEventListener('click', () => { forget(); location.reload(); });
    bar.appendChild(btn);
  }

  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('pwBtn'), err = $('lockErr');
    btn.disabled = true; btn.textContent = 'פותח…'; err.hidden = true;
    const pw = $('pw').value;
    try {
      const json = await unlock(pw);
      if ($('pwRemember').checked) {
        try {
          localStorage.setItem(KEY, JSON.stringify(
            {p: pw, exp: Date.now() + DAYS * 864e5}));
        } catch (_) {}
        reveal(json, true);
      } else {
        forget();
        reveal(json, false);
      }
    } catch (_) {
      err.hidden = false;
      btn.disabled = false; btn.textContent = 'כניסה';
      $('pw').select();
    }
  });

  if (!window.isSecureContext || !crypto.subtle) {
    $('lockErr').textContent = 'הדף חייב להיפתח דרך הקישור המאובטח (https).';
    $('lockErr').hidden = false;
    return;
  }

  // פתיחה אוטומטית אם הסיסמה נשמרה במכשיר
  const saved = remembered();
  if (saved) {
    $('pwBtn').disabled = true;
    $('pwBtn').textContent = 'פותח…';
    $('lockForm').insertAdjacentHTML('beforeend',
      '<div class="lockbusy" id="lockBusy">מזהה מכשיר מוכר…</div>');
    unlock(saved).then(json => reveal(json, true)).catch(() => {
      forget();                       // הסיסמה הוחלפה מאז
      $('pwBtn').disabled = false;
      $('pwBtn').textContent = 'כניסה';
      const busy = $('lockBusy'); if (busy) busy.remove();
      $('lockErr').textContent = 'הסיסמה השתנתה — הקלד את החדשה';
      $('lockErr').hidden = false;
    });
  }
})();
</script>
